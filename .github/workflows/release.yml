# Publish to npm when a version tag is pushed.
#
# Authentication: npm trusted publishing (OIDC) only. The workflow proves its
# identity to the registry (hence `permissions.id-token: write`); there is no
# token secret and nothing to log in to. Configure once via npm-oidc-setup.sh
# or npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions
# (`ZSeven-W/dsh-game-studio`, `release.yml`).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (e.g. v0.1.0-rc.6)'
        required: false
        type: string

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        run: |
          raw_ref="${{ inputs.tag || github.ref_name }}"
          tag="${raw_ref#v}"
          pkg="$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Build and run tests
        run: npm run build && npm test

      - name: Publish
        run: |
          name="$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).name")"
          pkg="$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg is already on the registry — nothing to publish."
            exit 0
          fi
          npm publish --access public --tag latest
