# Build and run the test suite on every push and PR.
#
# The playtest tests drive a real headless Chrome; ubuntu-latest ships one, so
# they run here. On a machine without Chrome or Edge they are skipped, which is
# why a green check elsewhere is not proof that playtests work.
name: Plugin check

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      # Builds one 2D and one 3D game, exports both for WeChat, boots the
      # exported projects in the mock wx harness and checks the runtime
      # (WebGL compositing, HUD, audio, ads, device tier). Browser checks are
      # skipped, not failed, when the runner has no Chrome.
      - name: WeChat acceptance run
        run: npm run acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-acceptance
          path: ../artifacts/acceptance
          if-no-files-found: ignore
          retention-days: 7

