# Build and run the test suite on every push and PR.
#
# The playtest tests drive a real headless Chrome; ubuntu-latest ships one, so
# they run here. On a machine without Chrome or Edge they are skipped, which is
# why a green check elsewhere is not proof that playtests work.
name: Plugin check

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      # Boots the built lib/ the way the host loads an installed package: create,
      # export, wizard, commerce, DevTools refusal. No browser and no profile needed.
      - name: Installed-build smoke
        run: node scripts/installed-check.mjs --path . --no-browser
      # Builds one 2D and one 3D game, exports both for WeChat, boots the
      # exported projects in the mock wx harness and checks the runtime
      # (WebGL compositing, HUD, audio, ads, device tier) plus the schema drill
      # (subpackages, payment API, package budget). Browser checks are skipped,
      # not failed, when the runner has no Chrome.
      - name: WeChat acceptance run
        run: npm run acceptance -- --out artifacts/acceptance
      # Renders the sidebar panels from the real client source (headless Chrome).
      - name: Sidebar screenshots
        run: npm run shots -- --out artifacts/sidebar
      - name: Traceability table
        run: npm run trace
      # A red run must explain itself in the log, not only in an artefact.
      - name: Acceptance report tail
        if: failure()
        run: tail -n 40 artifacts/acceptance/REPORT.md 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-evidence
          path: |
            artifacts/acceptance
            artifacts/sidebar
          if-no-files-found: warn
          retention-days: 7
